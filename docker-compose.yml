services:
  resume-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume_ai_app
    ports:
      - "8080:8080"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - resume_data:/app/data
    restart: unless-stopped

volumes:
  resume_data:
